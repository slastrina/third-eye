[package]
name = "third-eye"
version = "0.1.0"
description = "Third Eye — instant AI overlay"
authors = ["slastrina"]
edition = "2021"

[lib]
name = "third_eye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
futures-util = "0.3"
# native-tls (M004 S03) powers the https cloud providers: SecureTransport on
# macOS, schannel on Windows (pure Rust over windows-sys — msvc cross-check
# safe), openssl on Linux (libssl-dev already installed by linux-check.sh).
# The LM Studio loopback path stays plain-http and never negotiates TLS.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
# process + io-util (added S02 T01): the production McpExecutor references
# rmcp's TokioChildProcess/serve path, so the LIBRARY (not just dev tests) now
# needs tokio's `process` (spawn the MCP server child) and `io-util` (async
# stdio read/write for the transport). Both are pure Rust on every target — no
# C, no windows-sys — so they stay green on the Windows-msvc cross-check and the
# Linux container check (R020).
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process", "io-util"] }
# Encode pipeline (capture/encode.rs): PNG only — no other codecs needed,
# and the pipeline is unit-tested cross-platform with synthetic pixels.
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Redaction engine (privacy/, D028): pure Rust, no C — safe for the Windows
# msvc cross-check and the Linux container check.
regex = "1"
# Endpoint trust classification for the privacy guard (llm/guard.rs): URL
# parsing only, no DNS. Already in the tree via reqwest — zero new compile cost.
url = "2"
# Official MCP Rust SDK (D041, MEM159/MEM160) for the M007 MCP host. The
# stdio-child-process client feature set: `client` (JSON-RPC client +
# tokio-stream) and `transport-child-process` (spawns an MCP server over stdio;
# transitively activates tokio/process + tokio/io-util via transport-async-rw).
# Its stdio path is pure Rust (process-wrap, tokio-util, which is NOT pulled by
# this set) — no C, no windows-sys — so it stays green on the Windows-msvc
# cross-check and the Linux container check with no new system dep. Production
# McpExecutor wiring is S02; S01 exercises this crate only via the live test.
#
# S05 adds the remote HTTP/SSE transport:
# - `transport-streamable-http-client-reqwest` — the StreamableHttpClientTransport
#   + reqwest StreamableHttpClient impl + from_uri/from_config constructors.
# - `reqwest-native-tls` — routes rmcp's reqwest onto the SAME native-tls stack
#   S03 already chose (SecureTransport/macOS, schannel/msvc, openssl/Linux). We
#   deliberately do NOT enable the plain `reqwest` feature: it activates
#   `reqwest?/rustls`, compiling a SECOND TLS backend (rustls + ring/aws-lc-rs,
#   carrying C/asm) — dependency bloat + a direct R020 msvc/Linux cross-check
#   risk. R020 gate: Cargo.lock must contain no `aws-lc-sys`.
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
# YAML frontmatter parser for markdown skill packs (M007 S06, llm/skills.rs).
# serde_yml is the maintained successor to the deprecated serde_yaml; it
# deserializes the SKILL.md frontmatter block straight into a #[derive(Deserialize)]
# struct, matching the serde pattern used everywhere else. It is pure Rust
# (libyml is a Rust translation of libyaml — no C, no windows-sys) so the R020
# Windows-msvc and Linux cross-checks stay green and Cargo.lock stays free of
# aws-lc-sys. Only the frontmatter YAML uses it; the `---` split is hand-rolled.
serde_yml = "0.0.12"

[dev-dependencies]
# net + io-util power the raw TcpListener mock server in llm tests; `process`
# is added for the M007 live stdio wire-proof (tests/mcp_stdio_live.rs), which
# builds a tokio::process::Command child for rmcp's TokioChildProcess transport.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process"] }

# The rmcp `server` feature (ServerHandler + transport-async-rw, pulling only
# schemars + pastey — already in Cargo.lock, both pure Rust with no C /
# windows-sys, so the R020 Windows-msvc and Linux cross-checks stay green)
# powers the in-process fake MCP server the S02 T03 contract test serves over a
# tokio::io::duplex pair: a tiny hand-written ServerHandler advertising a fake
# tool, driving the true tools/list + tools/call protocol through a REAL rmcp
# client with no child process and no network (unlike the #[ignore]-gated
# mcp_stdio_live.rs). Dev-only — the production dep above stays the minimal
# client set; feature unification adds `server` to it only for the test build.
rmcp = { version = "2.2", default-features = false, features = ["server"] }

# MockRuntime + get_ipc_response for the capability-ACL regression test
# (tests/capability_acl.rs, MEM115). Dev-only: feature unification does not
# leak `test` into plain `cargo check`/release builds (resolver v2).
tauri = { version = "2", features = ["test"] }

# TLS-terminating mock HTTPS provider for the S03 cloud-client wire proof
# (tests/cloud_client_live.rs). Wraps the SAME native-tls already in the tree
# via reqwest (schannel on the Windows msvc cross-check, SecureTransport on
# macOS, openssl on Linux) — no new TLS backend, no C/asm dep.
tokio-native-tls = "0.3"

# SQLite binding for the S02 memory store, split across two target tables per
# D021 (probe-proven): `bundled` compiles the vendored sqlite3.c with FTS5 on
# macOS/Linux, while the Windows table disables default features so the msvc
# cross-check from macOS emits only a link directive and never compiles C.
# Do NOT collapse this into a plain [dependencies] entry — that breaks
# `cargo check --target x86_64-pc-windows-msvc`.
[target.'cfg(not(target_os = "windows"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.32", default-features = false }

# Global hotkey registration — desktop only (plugin does not build for mobile)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
# Launch-at-login registration (macOS LaunchAgent / Windows run key / Linux
# XDG autostart) — desktop only
tauri-plugin-autostart = "2"
# Hotkey persistence (settings.json); S07 reuses this store for lane models
# and privacy mode — desktop only
tauri-plugin-store = "2"
# OS credential store for cloud API keys (M004 S02). Default v1 features are
# the platform trio: macOS Keychain, Windows Credential Manager (windows-sys
# bindings — no C, msvc cross-check safe), Linux secret-service over zbus
# (pure Rust — no libdbus apt dep in scripts/linux-check.sh).
keyring = "4"

# Nonactivating NSPanel conversion — macOS only, git-pinned (v2.1 branch is not on crates.io)
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
# Safe ScreenCaptureKit bindings for the one-frame self-excluded capture
# backend. macos_14_0 unlocks SCScreenshotManager (single-shot capture without
# a stream); the app already requires a modern macOS.
screencapturekit = { version = "8.0", features = ["macos_14_0"] }
# Apple Vision OCR backend (S01 watcher): generated typed ObjC bindings — no
# second Swift bridge stage (objc2 links no Swift; the MEM034 rpath already
# covers screencapturekit's bridge). objc2-core-graphics carries the CGImage
# type Vision reads; the capture crate's CGImage is cast to it in ocr/macos.rs.
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-vision = "0.3"
# Frontmost-app name for TextObservation.appContext (S01 watcher):
# NSWorkspace/NSRunningApplication — two message sends, no AX spelunking.
objc2-app-kit = "0.3"
# NSEvent global-monitor blocks (tray panel outside-click dismiss). Already
# in the tree transitively via objc2; declared to use RcBlock directly.
block2 = "0.6"
# HID event synthesis (input/macos.rs): enigo wraps CGEvent for mouse/keyboard
# without hand-rolling per-platform FFI. macOS-ONLY (R020) — on Linux it pulls
# X11/libxdo and on Windows win32; declaring it here keeps the cross-target
# checks compiling FallbackInput with zero new system deps. enigo holds a
# !Send CGEventSource (enigo#96), so MacosInput never stores an Enigo — it is
# constructed fresh per action inside spawn_blocking.
enigo = "0.6"

# CoreText renders the synthetic in-memory image the NON-ignored Vision test
# recognizes — Vision on an in-memory CGImage needs no TCC permission.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-text = "0.3"
