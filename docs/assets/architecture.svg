<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Third Eye architecture: overlay UI, Rust core, tools, and the local model">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8ea1bf"/></marker>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17294a"/><stop offset="1" stop-color="#101d34"/></linearGradient>
  </defs>
  <rect width="1100" height="560" rx="18" fill="#0b1422"/>
  <g font-size="13" fill="#c7d3e6">
    <!-- UI -->
    <rect x="40" y="40" width="300" height="200" rx="14" fill="url(#card)" stroke="#2c4368"/>
    <text x="60" y="70" font-size="16" font-weight="700" fill="#f3f7ff">Webviews (React + TypeScript)</text>
    <text x="60" y="100">• Overlay chat · Settings · HUD pill</text>
    <text x="60" y="122">• Tray panel · Memory window · Tour</text>
    <text x="60" y="144">• Pure reducers, unit-tested (Vitest)</text>
    <text x="60" y="166">• Playwright drives the real bundle</text>
    <text x="60" y="206" fill="#8ea1bf">events + IPC ↕</text>
    <!-- Core -->
    <rect x="400" y="40" width="300" height="200" rx="14" fill="url(#card)" stroke="#93da49"/>
    <text x="420" y="70" font-size="16" font-weight="700" fill="#f3f7ff">Rust core (Tauri)</text>
    <text x="420" y="100">• Tool loop: rounds, budgets, breakers</text>
    <text x="420" y="122">• Approval gates · run modes · allowlists</text>
    <text x="420" y="144">• URL grounding · progress rule</text>
    <text x="420" y="166">• Privacy redaction at every choke point</text>
    <text x="420" y="188">• Run traces · always-on log</text>
    <!-- Model -->
    <rect x="760" y="40" width="300" height="200" rx="14" fill="url(#card)" stroke="#2c4368"/>
    <text x="780" y="70" font-size="16" font-weight="700" fill="#f3f7ff">Local model (LM Studio)</text>
    <text x="780" y="100">• OpenAI-compatible endpoint</text>
    <text x="780" y="122">• thin / heavy / coder lanes</text>
    <text x="780" y="144">• Lane health checked at boot</text>
    <text x="780" y="166">• Optional cloud, explicit opt-in</text>
    <text x="780" y="188">• Live evals score the real model</text>
    <!-- Tools -->
    <rect x="40" y="300" width="1020" height="220" rx="14" fill="url(#card)" stroke="#2c4368"/>
    <text x="60" y="330" font-size="16" font-weight="700" fill="#f3f7ff">Tools — every one refuses typed and reports what the OS actually observed</text>
    <g font-size="13">
      <text x="60" y="365" fill="#93da49" font-weight="700">See</text>
      <text x="60" y="387">screen_query (AX + OCR)</text><text x="60" y="407">read_page · take_screenshot</text><text x="60" y="427">wait_for_text · browser page_text</text>
      <text x="330" y="365" fill="#93da49" font-weight="700">Act</text>
      <text x="330" y="387">input_action (verified)</text><text x="330" y="407">ui_action · browser · open</text><text x="330" y="427">text_selection · focus_app</text>
      <text x="600" y="365" fill="#93da49" font-weight="700">Work</text>
      <text x="600" y="387">run_command · run_in_workspace</text><text x="600" y="407">read/write/list · workspace_diff</text><text x="600" y="427">find_files · processes · mac</text>
      <text x="850" y="365" fill="#93da49" font-weight="700">Remember</text>
      <text x="850" y="387">memory_search · remember</text><text x="850" y="407">chat_history_search</text><text x="850" y="427">auto-recall in the system turn</text>
    </g>
    <text x="60" y="480" fill="#8ea1bf">Dangerous verbs always ask · mutations gate on run mode + approval · teach mode strips the invisible shortcuts</text>
  </g>
  <g stroke="#8ea1bf" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M340 140 H398"/>
    <path d="M700 140 H758"/>
    <path d="M550 240 V298"/>
  </g>
</svg>
