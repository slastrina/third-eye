<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Third Eye logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#1b2f4d"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9ff9a"/>
      <stop offset="0.55" stop-color="#93da49"/>
      <stop offset="1" stop-color="#4f8f1f"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="50" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- eye -->
  <path d="M40 136 C 70 84, 186 84, 216 136 C 186 188, 70 188, 40 136 Z" fill="#0b1422" stroke="#93da49" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="128" cy="136" r="30" fill="url(#iris)" filter="url(#glow)"/>
  <circle cx="128" cy="136" r="12" fill="#0b1422"/>
  <circle cx="139" cy="126" r="5" fill="#ffffff" fill-opacity="0.85"/>
  <!-- third eye mark -->
  <circle cx="128" cy="62" r="9" fill="#93da49" filter="url(#glow)"/>
  <path d="M112 62 L 96 62 M144 62 L 160 62" stroke="#93da49" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
</svg>
