<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Third Eye — a local AI that can see your screen and use your Mac">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1220"/>
      <stop offset="0.6" stop-color="#132441"/>
      <stop offset="1" stop-color="#1c3457"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e2ffb0"/>
      <stop offset="0.5" stop-color="#93da49"/>
      <stop offset="1" stop-color="#3f7a18"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200"/>
    <path d="M300 0 V420 M600 0 V420 M900 0 V420"/>
  </g>
  <!-- eye -->
  <g transform="translate(200 210)">
    <path d="M-150 0 C -100 -80, 100 -80, 150 0 C 100 80, -100 80, -150 0 Z" fill="#0b1422" stroke="#93da49" stroke-width="7" stroke-linejoin="round"/>
    <circle r="50" fill="url(#iris)" filter="url(#glow)"/>
    <circle r="20" fill="#0b1422"/>
    <circle cx="18" cy="-16" r="8" fill="#ffffff" fill-opacity="0.85"/>
    <circle cy="-118" r="12" fill="#93da49" filter="url(#glow)"/>
    <path d="M-24 -118 H-52 M24 -118 H52" stroke="#93da49" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>
  <!-- title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#f3f7ff">
    <text x="420" y="150" font-size="64" font-weight="700" letter-spacing="-1">Third Eye</text>
    <text x="420" y="200" font-size="26" fill="#c7d3e6">A local AI that can see your screen and use your Mac.</text>
    <text x="420" y="240" font-size="18" fill="#93da49">Runs on your machine · every action verified · asks before anything risky</text>
  </g>
  <!-- glass chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6eefc">
    <g transform="translate(420 285)"><rect width="150" height="40" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.15"/><text x="75" y="26" text-anchor="middle">Local-first</text></g>
    <g transform="translate(585 285)"><rect width="170" height="40" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.15"/><text x="85" y="26" text-anchor="middle">Sees the screen</text></g>
    <g transform="translate(770 285)"><rect width="170" height="40" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.15"/><text x="85" y="26" text-anchor="middle">Uses your apps</text></g>
    <g transform="translate(955 285)"><rect width="160" height="40" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.15"/><text x="80" y="26" text-anchor="middle">Teach Me mode</text></g>
  </g>
  <text x="420" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8ea1bf">macOS · Tauri + Rust + React · MIT licensed</text>
</svg>
